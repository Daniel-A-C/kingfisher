      <stop offset="0%" stop-color="#133d44" />
      <stop offset="100%" stop-color="#07181c" />
    </linearGradient>
    <linearGradient id="kfWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ae8f7" />
      <stop offset="55%" stop-color="#1ea8b8" />
      <stop offset="100%" stop-color="#0b4e59" />
    </linearGradient>
    <linearGradient id="kfBreast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d388" />
      <stop offset="100%" stop-color="#c46d34" />
