  <!-- ~10% outer margin baked in; high-contrast on light & dark themes -->
  <circle cx="64" cy="64" r="50" fill="url(#kfBg)" stroke="#dca248" stroke-width="4" />
  <circle cx="64" cy="64" r="42" fill="none" stroke="#f6d388" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />
